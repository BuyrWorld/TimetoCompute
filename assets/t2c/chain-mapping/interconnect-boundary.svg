<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">The electrical to optical boundary moves closer to the chip</title>
  <desc id="desc">Today copper covers chip, board and part of rack distances before pluggable optics and fibre. In the next architecture copper covers a shorter distance and co-packaged optics or optical input-output begins closer to the chip.</desc>
  <defs>
    <linearGradient id="copper" x1="0" x2="1"><stop stop-color="#7b4800"/><stop offset="1" stop-color="#ffb000"/></linearGradient>
    <linearGradient id="optics" x1="0" x2="1"><stop stop-color="#00a8c8"/><stop offset="1" stop-color="#39e7ff"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="5" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1200" height="300" rx="18" fill="#091012" stroke="#2b373b"/>
  <g font-family="Inter,Arial,sans-serif" fill="#a8b3b7" font-size="20" text-anchor="middle">
    <text x="300" y="48">CHIP</text><text x="480" y="48">BOARD</text><text x="660" y="48">RACK</text><text x="840" y="48">ROW</text><text x="1020" y="48">BUILDING</text>
  </g>
  <g stroke="#334146" stroke-dasharray="4 7"><path d="M300 60v206"/><path d="M480 60v206"/><path d="M660 60v206"/><path d="M840 60v206"/><path d="M1020 60v206"/></g>
  <g font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700">
    <text x="52" y="110" fill="#c7ff00">TODAY</text>
    <rect x="180" y="88" width="510" height="34" rx="17" fill="url(#copper)" filter="url(#glow)"/><text x="430" y="111" fill="#080b0c" text-anchor="middle">COPPER / ELECTRICAL</text>
    <path d="m690 88 20 17-20 17Z" fill="#ffb000"/>
    <rect x="710" y="88" width="410" height="34" rx="17" fill="url(#optics)" filter="url(#glow)"/><text x="915" y="111" fill="#041014" text-anchor="middle">PLUGGABLE OPTICS + FIBRE</text>
    <text x="52" y="212" fill="#39e7ff">NEXT</text>
    <rect x="180" y="190" width="260" height="34" rx="17" fill="url(#copper)" filter="url(#glow)"/><text x="310" y="213" fill="#080b0c" text-anchor="middle">COPPER</text>
    <path d="m440 190 20 17-20 17Z" fill="#ffb000"/>
    <rect x="460" y="190" width="660" height="34" rx="17" fill="url(#optics)" filter="url(#glow)"/><text x="790" y="213" fill="#041014" text-anchor="middle">CPO + OPTICAL I/O + FIBRE</text>
  </g>
  <text x="650" y="274" fill="#f5f7f7" font-family="Barlow Condensed,Arial Narrow,sans-serif" font-size="24" font-weight="700" text-anchor="middle">COPPER DOES NOT DISAPPEAR. LIGHT MOVES CLOSER TO THE CHIP.</text>
</svg>
