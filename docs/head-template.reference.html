<!-- ══════════════════════════════════════════════════════════════════
     T2C — canonical <head> block
     Replace the existing metadata in your layout template with this.
     Tokens in {{ }} are per-page; everything else is site-wide.
     ══════════════════════════════════════════════════════════════════ -->

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<!-- ─── PRIMARY ───────────────────────────────────────────────────
     Title: keep under 60 chars so Google shows all of it.
     Your current one is 84 and gets cut mid-sentence.
     Pattern: {specific page value} — T2C
     ─────────────────────────────────────────────────────────────── -->
<title>{{PAGE_TITLE}}</title>

<!-- Description: 150-158 chars. Yours is 209 and truncates.
     Lead with the verb, put the differentiator in the first 90 chars. -->
<meta name="description" content="{{PAGE_DESCRIPTION}}">

<link rel="canonical" href="https://timetocompute.com{{PATH}}">
<meta name="robots" content="index,follow,max-image-preview:large,max-snippet:-1,max-video-preview:-1">
<meta name="theme-color" content="#0B0B0C">
<meta name="color-scheme" content="dark light">

<!-- ─── OPEN GRAPH ────────────────────────────────────────────────
     THE BIG FIX. You are currently serving /Logo/logo-header.png —
     a 514x120 transparent logo — as og:image on a summary_large_image
     card. Twitter, LinkedIn and Slack all want 1200x630. A transparent
     PNG also composites onto whatever background the platform picks,
     which on LinkedIn is white: lime logo on white, unreadable.
     ─────────────────────────────────────────────────────────────── -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="T2C — Time to Compute">
<meta property="og:locale" content="en_GB">
<meta property="og:url" content="https://timetocompute.com{{PATH}}">
<meta property="og:title" content="{{PAGE_TITLE}}">
<meta property="og:description" content="{{PAGE_DESCRIPTION}}">
<meta property="og:image" content="https://timetocompute.com/assets/social/t2c-social-card.png">
<meta property="og:image:secure_url" content="https://timetocompute.com/assets/social/t2c-social-card.png">
<meta property="og:image:type" content="image/png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="T2C — Time to Compute. Which AI infrastructure companies are actually delivering.">

<!-- ─── TWITTER / X ───────────────────────────────────────────────
     Add twitter:site once the handle exists; without it the card
     renders but attributes to nobody.
     ─────────────────────────────────────────────────────────────── -->
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{PAGE_TITLE}}">
<meta name="twitter:description" content="{{PAGE_DESCRIPTION}}">
<meta name="twitter:image" content="https://timetocompute.com/assets/social/t2c-social-card.png">
<meta name="twitter:image:alt" content="T2C — Time to Compute. Which AI infrastructure companies are actually delivering.">
<!-- <meta name="twitter:site" content="@yourhandle"> -->

<!-- ─── FRESHNESS ─────────────────────────────────────────────────
     You already emit t2c-build. Expose it in the form crawlers read.
     A dataset that updates daily should say so.
     ─────────────────────────────────────────────────────────────── -->
<meta property="article:modified_time" content="{{BUILD_ISO}}">
<meta name="last-modified" content="{{BUILD_ISO}}">

<!-- ─── ICONS ─────────────────────────────────────────────────────
     NOTE: your assets live at /Logo/ with a capital L. Vercel paths
     are case-sensitive — /logo/ 404s. Move to lowercase /assets/ and
     leave a redirect, or this will bite on a future refactor.
     ─────────────────────────────────────────────────────────────── -->
<link rel="icon" href="/assets/icons/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/assets/icons/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">

<!-- ─── PERFORMANCE ───────────────────────────────────────────────
     Finnhub and SEC are called on most pages. Warm the connection. -->
<link rel="preconnect" href="https://finnhub.io" crossorigin>
<link rel="dns-prefetch" href="https://data.sec.gov">

<link rel="sitemap" type="application/xml" href="/sitemap.xml">
<link rel="alternate" type="application/rss+xml" title="T2C News Wire" href="/news/feed.xml">


<!-- ══════════════════════════════════════════════════════════════════
     STRUCTURED DATA
     You currently have none. This is the largest untapped SEO asset
     on the site, because T2C is genuinely a dataset and Google has a
     dedicated surface for those.
     ══════════════════════════════════════════════════════════════════ -->

<!-- 1 · ORGANISATION + WEBSITE + SEARCH ─────────────────────────────
     The SearchAction wires your Ctrl-K palette into Google's sitelinks
     search box. You already have the search UI; this exposes it. -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@graph": [
    {
      "@type": "Organization",
      "@id": "https://timetocompute.com/#org",
      "name": "T2C — Time to Compute",
      "url": "https://timetocompute.com/",
      "logo": {
        "@type": "ImageObject",
        "url": "https://timetocompute.com/assets/social/t2c-logo-square.png",
        "width": 512,
        "height": 512
      },
      "description": "Independent tracker of AI infrastructure delivery, from secured power to customer acceptance and disclosed billing.",
      "foundingDate": "2026",
      "knowsAbout": [
        "AI data centre capacity",
        "Neocloud operators",
        "Customer acceptance milestones",
        "Contracted power",
        "Revenue recognition in AI infrastructure"
      ]
    },
    {
      "@type": "WebSite",
      "@id": "https://timetocompute.com/#website",
      "url": "https://timetocompute.com/",
      "name": "T2C — Time to Compute",
      "publisher": { "@id": "https://timetocompute.com/#org" },
      "inLanguage": "en-GB",
      "potentialAction": {
        "@type": "SearchAction",
        "target": {
          "@type": "EntryPoint",
          "urlTemplate": "https://timetocompute.com/search/?q={search_term_string}"
        },
        "query-input": "required name=search_term_string"
      }
    }
  ]
}
</script>

<!-- 2 · DATASET  (home page and /sites/ only) ───────────────────────
     This is the one nobody in your space is doing. Google Dataset
     Search indexes these separately, and "AI data centre capacity by
     site" has essentially no competition as a structured dataset.
     Update dateModified from your existing build timestamp. -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Dataset",
  "@id": "https://timetocompute.com/#dataset",
  "name": "AI infrastructure delivery tracker — sites, capacity and acceptance status",
  "description": "Sourced records for AI data centre projects operated by listed neocloud companies, covering secured power, construction stage, energisation, customer acceptance and disclosed billing. Every figure carries the primary document that evidences it, and unevidenced stages are recorded as unknown rather than estimated.",
  "url": "https://timetocompute.com/sites/",
  "keywords": [
    "AI data centre",
    "neocloud",
    "contracted power",
    "megawatts",
    "customer acceptance",
    "IREN",
    "CoreWeave",
    "Nebius",
    "TeraWulf",
    "Applied Digital",
    "Keel Infrastructure"
  ],
  "creator": { "@id": "https://timetocompute.com/#org" },
  "license": "https://timetocompute.com/terms/",
  "isAccessibleForFree": true,
  "dateModified": "{{BUILD_ISO}}",
  "temporalCoverage": "2025/..",
  "spatialCoverage": "United States, Canada, Finland, Spain, Australia",
  "measurementTechnique": "Compilation from SEC EDGAR filings, company investor releases and operator presentations",
  "variableMeasured": [
    { "@type": "PropertyValue", "name": "Gross utility power", "unitText": "MW" },
    { "@type": "PropertyValue", "name": "Critical IT load", "unitText": "MW" },
    { "@type": "PropertyValue", "name": "Contracted capacity", "unitText": "MW" },
    { "@type": "PropertyValue", "name": "Delivery stage" },
    { "@type": "PropertyValue", "name": "Evidence confidence" }
  ]
}
</script>

<!-- 3 · BREADCRUMBS  (every page below root) ──────────────────────── -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "BreadcrumbList",
  "itemListElement": [
    { "@type": "ListItem", "position": 1, "name": "Home", "item": "https://timetocompute.com/" },
    { "@type": "ListItem", "position": 2, "name": "{{SECTION_NAME}}", "item": "https://timetocompute.com{{SECTION_PATH}}" },
    { "@type": "ListItem", "position": 3, "name": "{{PAGE_NAME}}" }
  ]
}
</script>

<!-- 4 · EXPLAINER PAGES ONLY  (/explainers/*) ─────────────────────── -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "TechArticle",
  "headline": "{{PAGE_NAME}}",
  "description": "{{PAGE_DESCRIPTION}}",
  "image": "https://timetocompute.com/assets/social/t2c-social-card.png",
  "author": { "@id": "https://timetocompute.com/#org" },
  "publisher": { "@id": "https://timetocompute.com/#org" },
  "dateModified": "{{BUILD_ISO}}",
  "isAccessibleForFree": true,
  "proficiencyLevel": "Beginner",
  "inLanguage": "en-GB"
}
</script>
