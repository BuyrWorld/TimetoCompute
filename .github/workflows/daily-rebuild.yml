# Daily production rebuild, then the filing freshness report and a live health check.
#
# 1. Triggers a production rebuild through a Vercel deploy hook. The build
#    refreshes the earnings snapshot (src/lib/earnings-snapshot.js) and checks
#    EDGAR for filings the record has not caught up with (src/lib/freshness.js).
# 2. Waits for that build's /freshness.json and keeps one GitHub issue,
#    labelled "freshness", listing the filings waiting to be reviewed — opened
#    or updated when there are some, closed when there are none.
# 3. Checks the live pages and API routes (scripts/health.mjs) and keeps one
#    issue labelled "health" open while anything is broken.
#
# Setup (once): create a deploy hook in Vercel (Project > Settings > Git >
# Deploy Hooks, branch "main") and save its URL as the repository secret
# VERCEL_DEPLOY_HOOK. The hook URL can trigger deploys, so keep it secret.
name: Daily rebuild

on:
  schedule:
    - cron: '0 10 * * *'   # 10:00 UTC every day
  workflow_dispatch:        # "Run workflow" button for an on-demand rebuild

permissions:
  contents: read
  issues: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Trigger the Vercel production build
        env:
          HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::error::VERCEL_DEPLOY_HOOK is not set. Create a deploy hook in Vercel and add it as a repository secret."
            exit 1
          fi
          code=$(curl -s -o response.json -w '%{http_code}' -X POST "$HOOK")
          echo "Vercel answered HTTP $code"
          if [ "$code" -lt 200 ] || [ "$code" -ge 300 ]; then
            echo "::error::The deploy hook did not accept the request."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Report filings not yet reviewed
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/freshness-issue.mjs

      # Runs even if the freshness report failed: a broken site matters more.
      - name: Check the live site works
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/health.mjs
